name: Dispatch CNB release builds

on:
  push:
    branches: [personal-release]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  dispatch:
    if: github.repository == 'JachinShen/prime-agent' && github.ref == 'refs/heads/personal-release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read release dispatcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .ci/cnb
      - name: Dispatch exact GitHub commit to CNB
        env:
          CNB_CI_TOKEN: ${{ secrets.CNB_CI_TOKEN }}
          CNB_CI_CONFIG_SHA: ${{ vars.CNB_CI_CONFIG_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .ci/cnb/bridge.py dispatch
